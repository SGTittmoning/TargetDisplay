#!/usr/sbin/nft -f
# Minimales Default-Deny-Inbound-Regelwerk: erlaubt nur Loopback,
# bereits etablierte/verwandte Verbindungen, Standard-ICMP-Diagnose und
# SSH (Verwaltungszugang). Ausgehender Verkehr (u.a. RTMP zu den Kameras)
# bleibt uneingeschraenkt. Siehe ansible/tasks/hardening.yml fuer den
# Deployment-Kontext.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        tcp dport 22 accept comment "SSH-Verwaltungszugang"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
