---
# Wartung/Updates. Nutzt das auf dem Pi installierte targetdisplay-update.sh
# (siehe tasks/maintenance_scripts.yml), da ein einfaches "apt upgrade"
# bei aktivem OverlayFS wirkungslos waere - jede Aenderung am Root-FS landet
# sonst nur im fluechtigen tmpfs-Layer und ist nach dem naechsten Reboot
# wieder weg. Das Skript uebernimmt den noetigen zweiphasigen Reboot-Tanz
# (Overlay/Boot-RO deaktivieren -> Updates -> wieder aktivieren -> Reboot).
#
# Aufruf:
#   ansible-playbook -i inventory.yml maintain.yml --limit <host>
#
# Es wird immer nur EIN Host gleichzeitig bearbeitet (serial: 1) und beim
# ersten Fehler abgebrochen - ein fehlerhafter Lauf trifft so hoechstens
# einen Stand.

- hosts: targetdisplay
  become: yes
  serial: 1
  max_fail_percentage: 0

  tasks:

    - name: targetdisplay-update.sh vorhanden?
      stat:
        path: /root/bin/targetdisplay-update.sh
      register: targetdisplay_update_script

    - name: Fehler falls Skript fehlt
      fail:
        msg: "/root/bin/targetdisplay-update.sh fehlt - zuerst install.yml (tasks/maintenance_scripts.yml) ausfuehren"
      when: not targetdisplay_update_script.stat.exists

    - name: "Phase 1: Update-Zyklus starten (begin)"
      command: /root/bin/targetdisplay-update.sh begin

    - name: Zwischenstatus auslesen
      command: /root/bin/targetdisplay-update.sh status
      register: targetdisplay_status_after_begin
      changed_when: false

    - name: Zwischen-Reboot falls noetig
      reboot:
        msg: "Reboot fuer targetdisplay-update.sh Phase 1 (OverlayFS deaktivieren)"
      when: "'awaiting-reboot-1' in targetdisplay_status_after_begin.stdout"

    # Exit 3: Updates eingespielt, aber nicht alle Paketquellen waren
    # lesbar (siehe targetdisplay-update.sh). Der Ablauf geht bis zum Reboot
    # weiter und schlaegt am Ende fehl.
    - name: "Phase 2: Updates einspielen (apply)"
      command: /root/bin/targetdisplay-update.sh apply
      register: targetdisplay_apply_result
      failed_when: targetdisplay_apply_result.rc not in [0, 3]

    - name: Ergebnis von apply anzeigen
      debug:
        var: targetdisplay_apply_result.stdout_lines

    - name: Finaler Reboot (OverlayFS/Boot-RO wieder aktivieren)
      reboot:
        msg: "Finaler Reboot nach Update - OverlayFS/Boot-RO wieder aktiv"

    - name: Endzustand pruefen (Overlay)
      command: raspi-config nonint get_overlay_now
      register: maintain_overlay_end
      changed_when: false

    # get_overlay_now liest nur die Kernel-Kommandozeile. Ob das Root-
    # Dateisystem wirklich ein Overlay ist, zeigt erst der Mount-Typ.
    - name: Endzustand pruefen (Root-Dateisystem tatsaechlich Overlay)
      command: findmnt -n -o FSTYPE /
      register: maintain_root_fstype
      changed_when: false

    - name: Endzustand pruefen (Boot-RO)
      command: raspi-config nonint get_bootro_now
      register: maintain_bootro_end
      changed_when: false

    - name: Endzustand pruefen (Dienst)
      command: systemctl is-active targetdisplay.service
      register: maintain_service_end
      changed_when: false
      failed_when: false

    - name: Ergebnis
      assert:
        that:
          - maintain_service_end.stdout | trim == 'active'
          - maintain_overlay_end.stdout | trim == '0'
          - maintain_root_fstype.stdout | trim == 'overlay'
          - maintain_bootro_end.stdout | trim == '0'
        success_msg: "Wartung fertig. Dienst aktiv, Overlay und Boot-RO aktiv."
        fail_msg: >-
          Endzustand nicht wie erwartet: Dienst={{ maintain_service_end.stdout | trim }},
          Overlay={{ maintain_overlay_end.stdout | trim }} (0=aktiv),
          Boot-RO={{ maintain_bootro_end.stdout | trim }} (0=aktiv),
          Root-Dateisystem={{ maintain_root_fstype.stdout | trim }} (erwartet: overlay).

    - name: Fehler, falls nicht alle Paketquellen gelesen werden konnten
      fail:
        msg: >-
          apt-get update konnte nicht alle Paketquellen lesen, die Updates sind
          evtl. unvollstaendig (Ausgabe von apply oben). Ursache beheben (z.B.
          Uhrzeit, Netz) und maintain.yml erneut ausfuehren.
      when: targetdisplay_apply_result.rc == 3
