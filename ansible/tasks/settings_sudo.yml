---
# Eng gefasstes sudo-Recht fuer den Dienst-Benutzer der App: je ein Skript
# zum Speichern von Ausschnitten, Stand-Auswahl und PIN (Begruendung in
# targetdisplay-save-lib.sh) sowie der Neustart des Geraets. Keine Shell,
# kein Passwort, keine weiteren Befehle.
#
# "visudo -cf %s" validiert die Syntax VOR dem Einspielen - eine defekte
# sudoers-Datei koennte sonst sudo systemweit lahmlegen.
- name: Sudo-Recht fuer Settings/Restart (targetdisplay-User) einspielen
  copy:
    dest: /etc/sudoers.d/targetdisplay-settings
    content: |
      {{ targetdisplay_service_user }} ALL=(root) NOPASSWD: /root/bin/targetdisplay-save-sections.sh
      {{ targetdisplay_service_user }} ALL=(root) NOPASSWD: /root/bin/targetdisplay-save-active-stand.sh
      {{ targetdisplay_service_user }} ALL=(root) NOPASSWD: /root/bin/targetdisplay-save-pin.sh
      {{ targetdisplay_service_user }} ALL=(root) NOPASSWD: /usr/sbin/reboot
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
