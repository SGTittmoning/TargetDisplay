---
# Read-only Root-Filesystem + read-only Boot-Partition ueber das eingebaute
# raspi-config Overlay/Bootro. Schuetzt vor Datenverlust/Korruption durch
# harte Stromabschaltung ohne sauberes Herunterfahren.
#
# Ersetzt ein aelteres, manuelles fstab-basiertes Verfahren (eigenes
# mount-Modul + eigene partuuid-Ermittlung) durch den offiziell
# unterstuetzten raspi-config-Mechanismus - identisches Vorgehen wie im
# oeffentlichen CamDisplay-Repo: https://github.com/SGTittmoning/CamDisplay
#
# WICHTIGE REIHENFOLGE: raspi-configs enable_bootro() verweigert die Arbeit,
# wenn das Overlay bereits aktiv ist ("Overlay in use; cannot update fstab") -
# /etc/fstab liegt auf dem Root-FS, eine Aenderung waere bei aktivem Overlay
# nur im fluechtigen tmpfs-Layer sichtbar und nach dem Reboot wieder weg.
# Deshalb hier zuerst bootro, danach erst overlay aktivieren - genau wie es
# targetdisplay-update.sh beim Wiederherstellen des ro-Zustands macht (erst
# enable_bootro, dann enable_overlayfs). Ein gemeinsamer Reboot am Ende
# aktiviert beides zusammen.
#
# Ist das Overlay auf einem Host schon aktiv und bootro soll nachtraeglich
# ergaenzt werden, schlaegt dieser Task hier fehl (siehe oben) - in dem Fall
# stattdessen einmal manuell "targetdisplay-writable.sh rw" (+ Reboot), dann
# "targetdisplay-writable.sh ro" (+ Reboot) auf dem Host ausfuehren.
#
# get_overlay_now/get_bootro_now: 0 = aktiv, 1 = nicht aktiv (raspi-config
# Konvention). get_overlay_now prueft nur, ob "overlayroot=tmpfs" beim
# AKTUELLEN Boot in der Kernel-Cmdline stand - das allein reicht als
# alleiniges Signal nicht: ein Host, auf dem bereits Overlay+Bootro liefen
# und dann per "targetdisplay-writable.sh rw" (+ Reboot) wieder deaktiviert
# wurden, hat das overlayroot-Paket weiterhin installiert, aber
# get_overlay_now meldet danach korrekt "1" (inaktiv) - das reine
# Paketstatus-Signal wuerde diesen Fall faelschlich als "schon erledigt"
# uebergehen und enable_overlayfs NIE mehr aufrufen (live am Test-Pi
# reproduziert: nach einem rw/ro-Test blieb "-e ...enable_overlay=true"
# bei einem erneuten Lauf wirkungslos). Umgekehrt kann auf einem frischen
# Image die Cmdline schon "overlayroot=tmpfs" enthalten OHNE dass das Paket
# installiert ist (siehe CamDisplay-Testlauf 2026-08-21) - dort meldete
# get_overlay_now faelschlich "aktiv", obwohl noch gar nichts wirkt. Beide
# Signale zusammen (aktivieren wenn EINES der beiden noch fehlt) decken
# beide Faelle ab.

- name: overlayroot Paketstatus ermitteln
  command: dpkg-query -W -f='${Status}' overlayroot
  register: targetdisplay_overlayroot_pkg
  changed_when: false
  failed_when: false

- name: Overlay-Status ermitteln
  command: raspi-config nonint get_overlay_now
  register: targetdisplay_overlay_status
  changed_when: false

- name: Bootro-Status ermitteln
  command: raspi-config nonint get_bootro_now
  register: targetdisplay_bootro_status
  changed_when: false

- name: Boot-Partition read-only setzen (nur moeglich solange Overlay noch inaktiv ist)
  command: raspi-config nonint enable_bootro
  when: targetdisplay_bootro_status.stdout | trim != '0'
  register: targetdisplay_bootro_enabled

- name: Overlay-Root aktivieren (installiert bei Bedarf das overlayroot-Paket)
  command: raspi-config nonint enable_overlayfs
  when: >-
    targetdisplay_overlay_status.stdout | trim != '0' or
    'install ok installed' not in targetdisplay_overlayroot_pkg.stdout
  register: targetdisplay_overlay_enabled

- name: Reboot fuer Bootro/Overlay-Aktivierung
  reboot:
    msg: "Reboot nach Aktivierung von Bootro/Overlay-Root"
  when: targetdisplay_bootro_enabled is changed or targetdisplay_overlay_enabled is changed
