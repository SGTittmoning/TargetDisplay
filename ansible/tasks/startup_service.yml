---
# Startet die X11-Session (matchbox-window-manager + play_it/App) beim Boot
# fuer den dedizierten "{{ targetdisplay_service_user }}"-User: ein
# systemd-Service fuehrt "startx <script>" direkt aus.

- name: .xinitrc aus Template rendern
  template:
    src: .xinitrc.j2
    dest: "/home/{{ targetdisplay_service_user }}/.xinitrc"
    owner: "{{ targetdisplay_service_user }}"
    group: "{{ targetdisplay_service_user }}"
    mode: "0700"
  register: targetdisplay_xinitrc

- name: targetdisplay.service aus Template rendern
  template:
    src: targetdisplay.service.j2
    dest: /etc/systemd/system/targetdisplay.service
    owner: root
    group: root
    mode: "0644"
  register: targetdisplay_service_unit

- name: systemd neu einlesen (nach Unit-Aenderung)
  systemd:
    daemon_reload: yes
  when: targetdisplay_service_unit is changed

# getty@tty1 konkurriert sonst um dieselbe TTY. Conflicts= in der Unit
# stoppt einen laufenden getty@tty1, verhindert aber nicht, dass er als
# aktiviertes Ziel wieder hochkommt; deshalb zusaetzlich deaktivieren.
- name: getty@tty1 deaktivieren (Konflikt um dieselbe TTY vermeiden)
  systemd:
    name: getty@tty1.service
    enabled: no
    state: stopped
  failed_when: false

# Neustart, sobald sich einer der App-Deploy-Schritte (Checkout, venv,
# config.yml, Logo) oder Unit/.xinitrc geaendert hat. Mit "started" allein
# liefe ein bereits laufender Dienst mit dem alten Code weiter.
- name: targetdisplay.service aktivieren und (neu)starten
  systemd:
    name: targetdisplay.service
    enabled: yes
    state: >-
      {{ 'restarted' if (
        targetdisplay_service_unit is changed or
        targetdisplay_xinitrc is changed or
        targetdisplay_app_checkout is changed or
        targetdisplay_app_venv is changed or
        targetdisplay_app_config is changed or
        targetdisplay_app_logo is changed
      ) else 'started' }}
