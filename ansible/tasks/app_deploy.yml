---
# TargetDisplay selbst: Code, Python-Abhaengigkeiten (venv), Konfiguration.

# Checkout, venv, config.yml und Logo werden registriert: startup_service.yml
# startet den Dienst neu, sobald einer davon "changed" meldet.
- name: "Aktuellen TargetDisplay-Stand nach {{ targetdisplay_app_path }} holen"
  git:
    repo: "{{ targetdisplay_git_repo }}"
    dest: "{{ targetdisplay_app_path }}"
    # Standardmaessig der Default-Branch des Repos (aktuell "main") - ohne
    # dieses Argument wuerde ein Test-Deploy eines Feature-Branches (vor
    # dessen Merge) sonst still den falschen,
    # unbeabsichtigten Stand ausrollen. Ueberschreibbar per
    # "-e targetdisplay_git_version=<branch|tag|commit>", siehe README.
    version: "{{ targetdisplay_git_version | default('main') }}"
    force: yes
  become_user: "{{ targetdisplay_service_user }}"
  register: targetdisplay_app_checkout

- name: Python-Abhaengigkeiten aus requirements.txt in eine venv installieren
  pip:
    requirements: "{{ targetdisplay_app_path }}/requirements.txt"
    virtualenv: "{{ targetdisplay_app_path }}/.venv"
    virtualenv_command: "python3 -m venv"
    virtualenv_site_packages: yes
  become_user: "{{ targetdisplay_service_user }}"
  register: targetdisplay_app_venv

- name: config.yml aus Template rendern
  template:
    src: config.yml.j2
    dest: "{{ targetdisplay_app_path }}/config.yml"
    owner: "{{ targetdisplay_service_user }}"
    group: "{{ targetdisplay_service_user }}"
    mode: "0600"
  register: targetdisplay_app_config

# ressources/logo.png kommt mit dem Checkout (generisches Platzhalter-
# Wappen). Liegt auf der Kontrollmaschine ein eigenes Logo unter
# ansible/files/logo.png (nicht im Repo, siehe .gitignore), ersetzt es den
# Platzhalter auf jedem Stand. Ohne force:no: die Datei auf der
# Kontrollmaschine ist massgeblich, ein erneuter Lauf zieht Aenderungen nach.
- name: Vorhandensein eines eigenen Logos pruefen (ansible/files/logo.png)
  stat:
    path: "{{ playbook_dir }}/files/logo.png"
  register: targetdisplay_custom_logo
  delegate_to: localhost
  become: no

- name: Eigenes Logo einspielen (ueberschreibt das mitgelieferte Platzhalter-Logo)
  copy:
    src: logo.png
    dest: "{{ targetdisplay_app_path }}/ressources/logo.png"
    owner: "{{ targetdisplay_service_user }}"
    group: "{{ targetdisplay_service_user }}"
    mode: "0644"
  become_user: "{{ targetdisplay_service_user }}"
  when: targetdisplay_custom_logo.stat.exists
  register: targetdisplay_app_logo
