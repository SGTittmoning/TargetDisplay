---
# Gemeinsame Werte fuer install.yml und update-app.yml. Beide erzeugen
# config.yml und den Dienst; abweichende Werte wuerden bei jedem Update
# etwas anderes einrichten.
# Release, das install.yml und update-app.yml ausrollen: ein Git-Tag, kein
# Branch. So erreicht ein Merge nach main die Staende erst mit dem
# naechsten Release. Muss zu VERSION in main.py passen (Test).
targetdisplay_release: v0.13.4

targetdisplay_service_user: targetdisplay
targetdisplay_app_path: "/home/{{ targetdisplay_service_user }}/TargetDisplay"
# Aufloesung aller Staende: per hdmi_cvt/hdmi_ignore_edid fest erzwungen
# (tasks/display_setup.yml), unabhaengig vom angeschlossenen Monitor, und
# identisch in config.yml (screenSize).
targetdisplay_screen_width: 1280
targetdisplay_screen_height: 800
