name: CI

# Kostenfrei nur bei OEFFENTLICHEN Repositories: GitHub-gehostete Standard-
# Runner (ubuntu-latest) haben dort kein Minutenlimit. Bei privaten Repos
# zaehlt jede Minute gegen ein Kontingent. Deshalb laufen alle Jobs nur,
# solange das Repo oeffentlich ist, und es werden ausschliesslich Standard-
# Runner und kostenlose Werkzeuge verwendet (keine "larger runners", keine
# lizenzpflichtigen Actions).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Prueft den Workflow selbst (Syntax, falsche Kontext-/Expression-
      # Referenzen, unbekannte Action-Inputs) - ein Fehler hier wuerde sonst
      # erst auffallen, wenn der eigentliche Job dadurch gar nicht erst
      # anspringt.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint

  shellcheck:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck -S warning ansible/files/*.sh play_it tests/run-script-tests.sh

  python:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.9"
      - name: ruff (Syntaxfehler und echte Fehler, siehe ruff.toml)
        run: ruff check .
      - name: Compile check
        run: python -m py_compile main.py camera.py transformlib.py

  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install pytest numpy opencv-python-headless av pyyaml pillow
      - name: pytest (Timer, Watchdog, PIN-Wartezeit, Perspektive, Rauchtest der Oberflaeche unter Xvfb, ...)
        run: xvfb-run -a python -m pytest -q tests
      - name: Regression tests for the maintenance scripts (stubbed system commands, no hardware)
        run: tests/run-script-tests.sh

  ansible:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install "ansible-lint==26.9.0"
      # base.yml nutzt das Modul "timezone", das nicht in ansible-core steckt,
      # sondern in community.general. Ohne die Collection scheitern lint und
      # Syntax-Check. Die Collection hier zu installieren spiegelt den Stand
      # eines Verwaltungsrechners mit vollem Ansible; sauberer waere, den Task
      # ohne Zusatz-Collection umzusetzen (Ansible-Umbau, nicht Teil der CI).
      - name: Install community.general
        run: ansible-galaxy collection install "community.general:13.3.0"
      - name: ansible-lint
        run: ansible-lint ansible/install.yml ansible/maintain.yml
      - name: Syntax check
        run: |
          # Ansible liest Inventories nur mit passender Dateiendung; die Vorlage
          # (.dist) wird deshalb als .yml kopiert.
          cp ansible/inventory.yml.dist "$RUNNER_TEMP/inventory.yml"
          ansible-playbook -i "$RUNNER_TEMP/inventory.yml" ansible/install.yml --syntax-check
          ansible-playbook -i "$RUNNER_TEMP/inventory.yml" ansible/maintain.yml --syntax-check

  pip-audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Prueft die echten Laufzeit-Abhaengigkeiten (av, PyYAML, Pillow,
      # opencv, numpy) gegen bekannte CVEs - auch die, die auf den Pis
      # bewusst ueber apt statt pip installiert werden (siehe Kommentare in
      # requirements.txt), damit z.B. eine Pillow-Sicherheitsluecke nicht
      # unbemerkt bleibt, nur weil das Paket dort nicht in requirements.txt
      # aufgelistet ist.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # sonst meldet pip-audit pip selbst als veraltet
          pip install -r requirements.txt opencv-python numpy pyyaml pillow
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # CLI statt gitleaks-action: die Action verlangt fuer Repos in einer
      # GitHub-Organisation einen kostenpflichtigen Lizenzschluessel, das CLI
      # nicht (dieses Repo liegt in der Organisation SGTittmoning). Version
      # fest gepinnt, Pruefsumme wird verifiziert.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
