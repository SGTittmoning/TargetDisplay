# ruff fuer den gesamten Code (App-Module, tools/, tests/).
#
# Ausgewaehlt sind Regeln, die echte Fehler oder Fallen finden und kaum
# Fehlalarme liefern. Reine Stilregeln (Anfuehrungszeichen, Zeilenlaenge,
# Docstrings, Typannotationen) bleiben bewusst aus.

# Aeltestes Python in der Flotte: Raspbian Bullseye (Python 3.9). ruff
# meldet damit keine Umbauten, die erst ab einer neueren Version laufen.
target-version = "py39"

[lint]
select = [
    "E4", "E7", "E9",  # Importfehler, mehrere Anweisungen pro Zeile u.ae., Syntaxfehler
    "F",               # pyflakes: undefinierte Namen, ungenutzte Importe/Variablen
    "W",               # Leerzeichen am Zeilenende u.ae.
    "B",               # bugbear: veraenderliche Standardwerte, Schleifenvariablen, ...
    "I",               # Sortierung der Importe
    "UP",              # veraltete Schreibweisen (bis Python 3.9)
    "PLE",             # pylint-Fehler
    "PLW1510",         # subprocess.run ohne ausdrueckliches check=
    "RUF100",          # ueberfluessige noqa-Kommentare
    "C901",            # zyklomatische Komplexitaet
    "N802", "N803", "N806",  # Namen von Funktionen, Argumenten, Variablen in snake_case
]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# edit_section_points() und das Messwerkzeug liegen ueber der Grenze.
"flows.py" = ["C901"]
"tools/*" = ["C901"]
